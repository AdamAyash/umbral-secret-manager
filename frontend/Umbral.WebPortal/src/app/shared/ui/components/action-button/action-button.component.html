<button
  (click)="onButtonClicked()"
  type="button"
  class="inline-flex items-center justify-center gap-2 rounded-xl bg-[#8B5CF6] px-4 py-2.5 text-sm font-semibold text-white shadow-[0_10px_30px_rgba(139,92,246,0.2)] transition hover:scale-110 ease-in-out hover:bg-[#7C3AED] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#A78BFA]"
>
  <i class="pi pi-plus text-xs"></i>
  <span>{{ buttonText() }}</span>
</button>
