<div class="inline-flex w-full rounded-xl border border-surface-600">
  <div
    class="flex h-10 w-10 items-center justify-center border-r border-surface-600 bg-[#8B5CF6]/12"
  >
    <i class="pi pi-search text-[#C4B5FD]"></i>
  </div>

  <input
    pInputText
    type="search"
    autocomplete="off"
    [placeholder]="placeHolder()"
    [fluid]="true"
    (input)="onChangeValue($event)"
    class="h-10 border-none! outline-none! shadow-none! bg-transparent!"
  />
</div>
