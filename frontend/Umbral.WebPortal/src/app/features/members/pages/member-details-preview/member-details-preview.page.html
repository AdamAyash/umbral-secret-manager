<umbral-base-page-template [pageReference]="this">
  <section class="mb-6">
    <umbral-page-titles [pageReference]="this"></umbral-page-titles>
  </section>

  <section class="grid gap-6 xl:grid-cols-[340px_minmax(0,1fr)]">
    <aside class="h-fit overflow-hidden rounded-2xl border border-[#A78BFA1F] bg-[#0B1020]/80">
      <div class="p-5">
        <div class="mb-6 flex items-center gap-3">
          <div
            class="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-[#8B5CF6]/15 text-base font-bold text-[#C4B5FD]"
          >
            {{ member?.initials || '--' }}
          </div>
          <div class="min-w-0">
            <p class="truncate font-semibold text-[#F8FAFC]">
              {{ member?.name || 'Unknown member' }}
            </p>
            <p class="truncate text-sm text-[#94A3B8]">{{ member?.email || 'No email address' }}</p>
          </div>
        </div>

        <dl class="space-y-4">
          <div>
            <dt class="text-xs font-medium uppercase tracking-wider text-[#64748B]">Member ID</dt>
            <dd class="mt-1 break-all font-mono text-sm text-[#CBD5E1]">{{ member?.id || '—' }}</dd>
          </div>
          <div>
            <dt class="text-xs font-medium uppercase tracking-wider text-[#64748B]">Email</dt>
            <dd class="mt-1 break-all text-sm text-[#CBD5E1]">{{ member?.email || '—' }}</dd>
          </div>
          <div>
            <dt class="text-xs font-medium uppercase tracking-wider text-[#64748B]">Role</dt>
            <dd class="mt-1 text-sm font-medium text-[#CBD5E1]">{{ member?.role || '—' }}</dd>
          </div>
          <div>
            <dt class="text-xs font-medium uppercase tracking-wider text-[#64748B]">Status</dt>
            <dd class="mt-2">
              <span
                class="rounded-full border px-2 py-1 text-xs font-semibold"
                [class]="getMemberStatusClass(member?.status)"
              >
                {{ member?.status || 'Unknown' }}
              </span>
            </dd>
          </div>
          <div>
            <dt class="text-xs font-medium uppercase tracking-wider text-[#64748B]">Last active</dt>
            <dd class="mt-1 text-sm text-[#CBD5E1]">{{ member?.lastActiveAt || '—' }}</dd>
          </div>
        </dl>
      </div>
    </aside>

    <!-- Project grid for this member will be added here. -->
  </section>
</umbral-base-page-template>
