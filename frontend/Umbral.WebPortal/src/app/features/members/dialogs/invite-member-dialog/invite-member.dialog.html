<umbral-base-dialog-template title="Invite member" [dialogController]="this.baseDialogController()">
  <!-- <div class="text-sm">
    <p>An invite is specific to an email address and expires after 1 day.</p>
  </div> -->

  <div class="flex">
    <form name="invite-member">
      <div class="w-full flex">
        <label for="email">Email address</label>
      </div>
      <div>
        <input
          pInputText
          [variant]="'filled'"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="Enter your email address"
          required
          fluid
        />
      </div>
      <button type="submit">Send Invitation</button>
    </form>
  </div>
</umbral-base-dialog-template>
