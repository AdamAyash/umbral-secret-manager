<umbral-base-page-template [pageReference]="this"> </umbral-base-page-template>
<section class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
  <umbral-page-titles [pageReference]="this"></umbral-page-titles>

  <umbral-action-button buttonText="New Secret"></umbral-action-button>
</section>
<div class="secrets-table rounded-2xl border border-[#A78BFA1F] bg-[#0B1020]/80 p-4 sm:p-5">
  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-3">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-[#8B5CF6]/12 text-[#C4B5FD]">
        <i class="pi pi-key text-sm"></i>
      </span>
      <div>
        <div>
          <p class="font-semibold text-surface-50">Project secrets</p>
        </div>
        <p class="mt-1 text-xs text-[#94A3B8]">Credentials stored securely for this project</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <label class="relative block w-full max-w-xs">
        <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[#64748B]"></i>
        <input
          type="search"
          placeholder="Search members"
          aria-label="Search members"
          class="w-full rounded-xl border border-[#A78BFA1F] bg-[#03040A]/60 py-2.5 pl-9 pr-3 text-sm text-surface-50 placeholder:text-[#64748B] outline-none transition focus:border-[#8B5CF6] focus:ring-2 focus:ring-[#8B5CF6]/20"
        />
      </label>
      <p-select
        class="rounded-xl! border border-[#A78BFA1F]! text"
        [options]="environmentOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="All environments"
        ariaLabel="Filter secrets by environment"
        (onChange)="secretsTable.filter($event.value, 'environment', 'equals')"
      />
    </div>
  </div>

  <p-table #secretsTable [value]="secrets()" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Value</th>
        <th class="text-right">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-secret>
      <tr>
        <td>
          <p-cellEditor>
            <ng-template #input>
              <input
                pInputText
                type="text"
                [(ngModel)]="secret.name"
                pSize="small"
                aria-label="Secret name"
              />
            </ng-template>
            <ng-template #output>
              <div class="flex items-center gap-3">
                <span
                  class="grid h-8 w-8 place-items-center rounded-lg bg-[#8B5CF6]/10 text-xs text-[#C4B5FD]"
                >
                  <i class="pi pi-key"></i>
                </span>
                <span class="font-semibold text-surface-50">{{ secret.name }}</span>
              </div>
            </ng-template>
          </p-cellEditor>
        </td>
        <td [pEditableColumn]="secret.value" pEditableColumnField="value">
          <p-cellEditor>
            <ng-template #input>
              <p-password type="text" [(ngModel)]="secret.value" pSize="small" />
            </ng-template>
            <ng-template #output>
              <div class="flex items-center gap-2">
                <span class="secret-value">{{
                  isSecretRevealed(secret) ? secret.value : '••••••••••••••••'
                }}</span>
              </div>
            </ng-template>
          </p-cellEditor>
        </td>
        <td class="text-right">
          <div
            class="inline-flex items-center rounded-lg border border-transparent bg-[#03040A]/30 p-0.5 transition hover:border-[#A78BFA]/15 hover:bg-[#03040A]/60"
          >
            <button
              type="button"
              class="secret-action"
              aria-label="Copy secret value"
              title="Copy value"
            >
              <i class="pi pi-copy"></i>
            </button>
            <button
              type="button"
              class="secret-action secret-action-danger"
              aria-label="Delete secret"
              title="Delete secret"
            >
              <i class="pi pi-trash"></i>
            </button>
            <button
              type="button"
              class="secret-visibility"
              (click)="toggleSecretVisibility(secret)"
              [attr.aria-label]="
                isSecretRevealed(secret) ? 'Hide secret value' : 'Reveal secret value'
              "
              [title]="isSecretRevealed(secret) ? 'Hide value' : 'Reveal value'"
            >
              <i [class]="isSecretRevealed(secret) ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">
          <div class="flex flex-col items-center px-4 py-14 text-center">
            <span
              class="grid h-11 w-11 place-items-center rounded-2xl bg-[#8B5CF6]/10 text-[#C4B5FD]"
            >
              <i class="pi pi-key text-lg"></i>
            </span>
            <p class="mt-3 font-medium text-surface-50">No secrets yet</p>
            <p class="mt-1 max-w-sm text-sm text-[#94A3B8]">
              Add the first credential your project needs.
            </p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
