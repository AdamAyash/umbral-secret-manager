<section class="mx-auto w-full max-w-screen-2xl">
  <header class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
    <umbral-page-titles [pageReference]="this"></umbral-page-titles>

    <button
      type="button"
      class="inline-flex items-center justify-center gap-2 rounded-xl bg-[#8B5CF6] px-4 py-2.5 text-sm font-semibold text-white shadow-[0_10px_30px_rgba(139,92,246,0.2)] transition hover:bg-[#7C3AED] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#A78BFA]"
    >
      <i class="pi pi-plus text-xs"></i>
      <span>New project</span>
    </button>
  </header>

  <div class="mt-7 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">
    @for (project of projects(); track project.id) {
      <umbral-project-card [project]="project"></umbral-project-card>
    }
  </div>
</section>
