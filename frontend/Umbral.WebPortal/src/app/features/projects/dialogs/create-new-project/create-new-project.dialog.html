<umbral-base-dialog-template
  title="Create a new project"
  [dialogController]="this.baseDialogMediator()"
>
  <div class="pb-5">
    <p class="text-sm text-[#94A3B8]">Create new project to store your secrets and credentials.</p>
  </div>
  <form
    [formGroup]="this.createNewProjectForm"
    class="flex w-full flex-col gap-6"
    name="invite-member"
    (ngSubmit)="onSubmit()"
  >
    <div class="relative flex flex-col gap-2">
      <label for="project-name" class="text-sm font-semibold text-[#E2E8F0]">Project name</label>
      <input
        #projectName
        pInputText
        id="project-name"
        name="projectName"
        autocomplete="off"
        type="text"
        formControlName="projectName"
        placeholder="Type your project name"
        [fluid]="true"
        variant="filled"
        required
      />
      <umbral-error-message [control]="this.projectName!" fieldLabel="Project name">
      </umbral-error-message>
      <label for="project-description" class="text-sm font-semibold text-[#E2E8F0]"
        >Project description</label
      >
      <textarea
        rows="4"
        cols="10"
        variant="filled"
        pTextarea
        placeholder="Project description"
        formControlName="projectDescription"
      ></textarea>
      <umbral-error-message [control]="this.projectDescription!" fieldLabel="Project description">
      </umbral-error-message>
      <div class="flex flex-col-reverse pt-1 gap-3 sm:flex-row sm:justify-end">
        <p-button
          label="Cancel"
          severity="secondary"
          [outlined]="true"
          type="button"
          (onClick)="this.onCloseDialog()"
        />
        <p-button label="Create project" type="submit" />
      </div>
    </div>
  </form>
</umbral-base-dialog-template>
